<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid na pratica 1</title>
<style> 
    body {
    margin: 0;
    height: 100vh;
    padding: 10px;
    box-sizing: border-box;
    }

    .container { 
        display: grid; 
        grid-template-columns: repeat(4,1fr); 
        grid-template-rows: repeat(4,1fr); 
        height: 100%;
        gap: 5px; 
    }

    .box {
        color: white;
        font-size: 30px;
        -webkit-text-stroke: 0.4px black;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .box1 {
        background: green;
        grid-column: 1 / 2;
        grid-row: 1 / 2;
    }
    .box2 {
        background: orange;
        grid-column: 2 / 3;
        grid-row: 2 / 3;
    }
    .box3 {
        background: purple;
        grid-column: 3 / 4;
        grid-row: 3 / 4;
    }  
    .box4 {
        background: red;
        grid-column: 4 / 5;
        grid-row: 4 / 5;
    }

</style>    


</head>
<body>
    <div class="container">
        <div class="box box1">1</div>
        <div class="box box2">2</div>
        <div class="box box3">3</div>
        <div class="box box4">4</div>
    </div>  

</body>
</html>
